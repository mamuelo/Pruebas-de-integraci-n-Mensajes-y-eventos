services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 6
    networks:
      - rabbitmq-net

  orders-api:
    build: ./orders-api
    container_name: orders-api-rmq
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - QUEUE_NAME=pedidos
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - rabbitmq-net

  notification-worker:
    build: ./notification-worker
    # No se define container_name para permitir escalamiento horizontal (--scale notification-worker=2)
    environment:
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - QUEUE_NAME=pedidos
      - PROCESSING_DELAY_MS=3000
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - rabbitmq-net

volumes:
  rabbitmq_data:
    driver: local

networks:
  rabbitmq-net:
    driver: bridge
