<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="kBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="kApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="kBroker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="kConsumer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="kConsumer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="kConsumer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <filter id="shadowK" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="540" fill="url(#kBg)" rx="12" />

  <!-- Title -->
  <text x="475" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Arquitectura Orientada a Eventos con Apache Kafka (Anexo 2)
  </text>
  <text x="475" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c7d2fe" text-anchor="middle">
    Log persistente, eventos de dominio OrderCreated y Fan-Out independiente por Consumer Groups
  </text>

  <!-- Docker Host Frame -->
  <rect x="25" y="75" width="900" height="440" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="6 4" rx="8" />
  <text x="45" y="98" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8">
    DOCKER HOST (Bridge Network: kafka-net)
  </text>

  <!-- Client -->
  <rect x="40" y="215" width="120" height="85" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" rx="8" filter="url(#shadowK)" />
  <text x="100" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">CLIENTE HTTP</text>
  <text x="100" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Postman / curl</text>
  <text x="100" y="282" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">POST /orders</text>

  <!-- Arrow Client -> orders-api -->
  <path d="M 160 255 L 200 255" stroke="#38bdf8" stroke-width="2" />

  <!-- Container: orders-api -->
  <rect x="200" y="160" width="160" height="200" fill="url(#kApi)" stroke="#3b82f6" stroke-width="2" rx="8" filter="url(#shadowK)" />
  <rect x="210" y="170" width="140" height="22" fill="#1d4ed8" rx="4" />
  <text x="280" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#eff6ff" text-anchor="middle">orders-api (Kafka)</text>
  <text x="280" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">Puerto: 3000</text>
  <text x="280" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#bfdbfe" text-anchor="middle">• Valida entrada JSON</text>
  <text x="280" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#bfdbfe" text-anchor="middle">• Calcula total (qty*price)</text>
  <text x="280" y="262" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#bfdbfe" text-anchor="middle">• Evento: OrderCreated</text>
  <text x="280" y="279" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#bfdbfe" text-anchor="middle">• Key: orderId</text>
  <text x="280" y="296" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#bfdbfe" text-anchor="middle">• correlationId &amp; eventId</text>
  <text x="280" y="313" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#bfdbfe" text-anchor="middle">• Resp 202 Inmediata</text>
  <rect x="210" y="325" width="140" height="22" fill="#1e40af" rx="4" />
  <text x="280" y="339" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#eff6ff" text-anchor="middle">Productor de Eventos</text>

  <!-- Arrow orders-api -> Kafka -->
  <path d="M 360 255 L 400 255" stroke="#a855f7" stroke-width="2" />
  <text x="380" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#c084fc" text-anchor="middle">TCP:9092</text>

  <!-- Container: kafka broker -->
  <rect x="400" y="140" width="190" height="240" fill="url(#kBroker)" stroke="#a855f7" stroke-width="2" rx="8" filter="url(#shadowK)" />
  <rect x="410" y="150" width="170" height="22" fill="#7e22ce" rx="4" />
  <text x="495" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#faf5ff" text-anchor="middle">Broker: Apache Kafka</text>
  <text x="495" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e9d5ff" text-anchor="middle">Modo KRaft (sin ZooKeeper)</text>
  <text x="495" y="206" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#d8b4fe" text-anchor="middle">Puertos: 9092 / 29092</text>

  <!-- Topic Box -->
  <rect x="415" y="218" width="160" height="90" fill="#2e1065" stroke="#c084fc" stroke-width="1.5" rx="6" />
  <text x="495" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f3e8ff" text-anchor="middle">Tópico: 'orders.events'</text>
  <rect x="425" y="245" width="140" height="24" fill="#3b0764" rx="4" />
  <text x="495" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e9d5ff" text-anchor="middle">Partición 0 (Offsets: 0, 1, 2...)</text>
  <rect x="425" y="275" width="140" height="24" fill="#3b0764" rx="4" />
  <text x="495" y="290" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e9d5ff" text-anchor="middle">Partición 1 (Offsets: 0, 1, 2...)</text>
  <text x="495" y="326" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#d8b4fe" text-anchor="middle">Log persistente inmutable</text>

  <!-- kafka-ui badge attached below broker -->
  <rect x="410" y="340" width="170" height="26" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" rx="4" />
  <text x="495" y="356" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#a5b4fc" text-anchor="middle">Kafka UI (Puerto 8080)</text>

  <!-- Arrows from Kafka to 3 Consumers -->
  <path d="M 590 220 L 670 145" stroke="#10b981" stroke-width="2" />
  <path d="M 590 255 L 670 255" stroke="#f59e0b" stroke-width="2" />
  <path d="M 590 290 L 670 365" stroke="#f43f5e" stroke-width="2" />

  <!-- Consumer 1: inventory -->
  <rect x="670" y="100" width="220" height="95" fill="url(#kConsumer1)" stroke="#10b981" stroke-width="2" rx="8" filter="url(#shadowK)" />
  <rect x="680" y="108" width="200" height="18" fill="#047857" rx="4" />
  <text x="780" y="121" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ecfdf5" text-anchor="middle">inventory-consumer</text>
  <text x="780" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">Grupo: inventory-service-group</text>
  <text x="780" y="159" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">• Acción: Reserva de inventario</text>
  <text x="780" y="176" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">• Escalamiento a 2 réplicas (CP-10)</text>

  <!-- Consumer 2: billing -->
  <rect x="670" y="210" width="220" height="95" fill="url(#kConsumer2)" stroke="#f59e0b" stroke-width="2" rx="8" filter="url(#shadowK)" />
  <rect x="680" y="218" width="200" height="18" fill="#b45309" rx="4" />
  <text x="780" y="231" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fffbeb" text-anchor="middle">billing-consumer</text>
  <text x="780" y="252" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fde68a" text-anchor="middle">Grupo: billing-service-group</text>
  <text x="780" y="269" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fcd34d" text-anchor="middle">• Acción: Emisión de factura</text>
  <text x="780" y="286" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fcd34d" text-anchor="middle">• Registro contable del pedido</text>

  <!-- Consumer 3: notification -->
  <rect x="670" y="320" width="220" height="95" fill="url(#kConsumer3)" stroke="#f43f5e" stroke-width="2" rx="8" filter="url(#shadowK)" />
  <rect x="680" y="328" width="200" height="18" fill="#be123c" rx="4" />
  <text x="780" y="341" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fff1f2" text-anchor="middle">notification-consumer</text>
  <text x="780" y="362" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fecdd3" text-anchor="middle">Grupo: notification-service-group</text>
  <text x="780" y="379" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fda4af" text-anchor="middle">• Acción: Envío email/SMS cliente</text>
  <text x="780" y="396" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fda4af" text-anchor="middle">• Consumo fromBeginning: true</text>

  <!-- Footer note -->
  <rect x="40" y="465" width="870" height="36" fill="#090d16" stroke="#312e81" rx="6" />
  <text x="475" y="487" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">
    Regla Principal: Cada consumidor funcional posee su propio Consumer Group para recibir el 100% de los eventos (Fan-out). No existen llamadas HTTP entre ellos.
  </text>
</svg>
