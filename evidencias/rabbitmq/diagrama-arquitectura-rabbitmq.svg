<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)" rx="12" />

  <!-- Title -->
  <text x="450" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Arquitectura Basada en Mensajes con RabbitMQ (Anexo 1)
  </text>
  <text x="450" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Desacoplamiento asíncrono, persistencia de cola y balanceo con prefetch(1)
  </text>

  <!-- Docker Host Outer Frame -->
  <rect x="30" y="85" width="840" height="390" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" rx="8" />
  <text x="50" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">
    DOCKER HOST (Bridge Network: rabbitmq-net)
  </text>

  <!-- Client Box -->
  <rect x="50" y="190" width="130" height="90" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8" filter="url(#shadow)" />
  <text x="115" y="225" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">CLIENTE HTTP</text>
  <text x="115" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Postman / curl</text>
  <text x="115" y="263" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">JSON Order Payload</text>

  <!-- Arrow Client -> orders-api -->
  <path d="M 180 235 L 230 235" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="205" y="225" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">POST /orders</text>

  <!-- Container: orders-api -->
  <rect x="235" y="140" width="180" height="190" fill="url(#cardGrad1)" stroke="#60a5fa" stroke-width="2" rx="8" filter="url(#shadow)" />
  <rect x="245" y="150" width="160" height="24" fill="#1e40af" rx="4" />
  <text x="325" y="167" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#eff6ff" text-anchor="middle">Contenedor: orders-api</text>
  <text x="325" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">Puerto expuesto: 3000</text>
  <text x="325" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#bfdbfe" text-anchor="middle">• Valida entrada JSON</text>
  <text x="325" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#bfdbfe" text-anchor="middle">• Genera orderId único</text>
  <text x="325" y="255" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#bfdbfe" text-anchor="middle">• Inyecta correlationId</text>
  <text x="325" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#bfdbfe" text-anchor="middle">• Respuesta 202 Inmediata</text>
  <rect x="245" y="295" width="160" height="22" fill="#1d4ed8" rx="4" />
  <text x="325" y="310" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#eff6ff" text-anchor="middle">Productor AMQP</text>

  <!-- Arrow orders-api -> rabbitmq -->
  <path d="M 415 235 L 465 235" stroke="#f97316" stroke-width="2" />
  <text x="440" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#fb923c" text-anchor="middle">AMQP Publish</text>
  <text x="440" y="250" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">(persistent)</text>

  <!-- Container: rabbitmq -->
  <rect x="470" y="125" width="180" height="220" fill="url(#cardGrad2)" stroke="#f97316" stroke-width="2" rx="8" filter="url(#shadow)" />
  <rect x="480" y="135" width="160" height="24" fill="#9a3412" rx="4" />
  <text x="560" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fff7ed" text-anchor="middle">Contenedor: rabbitmq</text>
  <text x="560" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ffedd5" text-anchor="middle">rabbitmq:4-management</text>
  <text x="560" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fed7aa" text-anchor="middle">Puertos: 5672 / 15672</text>
  
  <!-- Cola pedidos inner box -->
  <rect x="485" y="220" width="150" height="65" fill="#431407" stroke="#ea580c" stroke-width="1.5" rx="6" />
  <text x="560" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle">Cola: 'pedidos'</text>
  <text x="560" y="258" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fdba74" text-anchor="middle">durable: true</text>
  <text x="560" y="274" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Ready / Unacked / Total</text>
  
  <text x="560" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fed7aa" text-anchor="middle">Consola Web: :15672</text>
  <text x="560" y="332" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fdba74" text-anchor="middle">admin / admin</text>

  <!-- Arrow rabbitmq -> notification-worker 1 -->
  <path d="M 650 210 L 700 175" stroke="#10b981" stroke-width="2" />
  <text x="675" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399" text-anchor="middle">AMQP</text>

  <!-- Arrow rabbitmq -> notification-worker 2 (scaling) -->
  <path d="M 650 260 L 700 295" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" />
  <text x="675" y="290" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399" text-anchor="middle">Scale</text>

  <!-- Container: notification-worker 1 -->
  <rect x="705" y="115" width="150" height="110" fill="url(#cardGrad3)" stroke="#10b981" stroke-width="2" rx="8" filter="url(#shadow)" />
  <rect x="715" y="123" width="130" height="20" fill="#065f46" rx="4" />
  <text x="780" y="137" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ecfdf5" text-anchor="middle">notification-worker</text>
  <text x="780" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">• prefetch(1)</text>
  <text x="780" y="177" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">• Delay 3s (simula tarea)</text>
  <text x="780" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">• Confirmación manual (ack)</text>
  <text x="780" y="212" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#6ee7b7" text-anchor="middle">Consumidor 1</text>

  <!-- Container: notification-worker 2 (Elastic) -->
  <rect x="705" y="245" width="150" height="110" fill="url(#cardGrad3)" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3" rx="8" filter="url(#shadow)" />
  <rect x="715" y="253" width="130" height="20" fill="#065f46" rx="4" />
  <text x="780" y="267" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ecfdf5" text-anchor="middle">notification-worker-2</text>
  <text x="780" y="290" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">• Réplica escalada (CP-10)</text>
  <text x="780" y="307" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">• Round-Robin automático</text>
  <text x="780" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">• Desacoplado de la API</text>
  <text x="780" y="342" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#6ee7b7" text-anchor="middle">Consumidor 2</text>

  <!-- Footer Notes -->
  <rect x="50" y="420" width="800" height="40" fill="#0f172a" stroke="#334155" rx="6" />
  <text x="450" y="444" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
    Regla Principal: La API nunca invoca al worker por HTTP. La comunicación está 100% mediada por RabbitMQ bajo protocolo AMQP.
  </text>
</svg>
